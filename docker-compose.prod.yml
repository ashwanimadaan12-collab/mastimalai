# Full single-VM production stack: PostgreSQL + API + Web + Admin + Caddy (HTTPS).
# Everything runs on ONE EC2 box. Caddy fetches free HTTPS certs automatically.
#
# Usage:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# DNS (before first run): point these A records at the EC2 public IP —
#   ROOT_DOMAIN, WEB_DOMAIN (www), API_DOMAIN, ADMIN_DOMAIN.
services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: masti
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: masti_malai
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U masti -d masti_malai"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 4000
      DATABASE_URL: postgresql://masti:${POSTGRES_PASSWORD}@db:5432/masti_malai?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      PLAYBACK_TOKEN_SECRET: ${PLAYBACK_TOKEN_SECRET}
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD}
      OTP_DEV_MODE: ${OTP_DEV_MODE}
      PAYMENTS_DRIVER: ${PAYMENTS_DRIVER}
      API_PUBLIC_URL: ${API_PUBLIC_URL}
      CORS_ORIGIN: ${CORS_ORIGIN}
      ADMIN_CORS_ORIGIN: ${ADMIN_CORS_ORIGIN}
      STORAGE_LOCAL_DIR: /data/storage
      STREAM_CACHE_DIR: /data/storage/hls-cache
      FFMPEG_PATH: /usr/bin/ffmpeg
      FFPROBE_PATH: /usr/bin/ffprobe
    volumes:
      - media_data:/data/storage
    # No host port needed — Caddy proxies to it over the internal network.
    expose:
      - "4000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${API_PUBLIC_URL}
    restart: always
    depends_on:
      - api
    expose:
      - "3000"

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${API_PUBLIC_URL}
    restart: always
    depends_on:
      - api
    expose:
      - "3001"

  caddy:
    image: caddy:2
    restart: always
    depends_on:
      - api
      - web
      - admin
    environment:
      ROOT_DOMAIN: ${ROOT_DOMAIN}
      WEB_DOMAIN: ${WEB_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  media_data:
  caddy_data:
  caddy_config:
